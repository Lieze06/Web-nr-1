<!-- Lettertype: Archivo (zwaar, schuin). Als het niet laadt, pakt de browser Helvetica/Arial. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ---------- KLEUREN EN LETTERS ----------
   Alles wat je wilt aanpassen aan kleur staat hier bovenaan. */
:root{
  --lucht-boven:#9fd0ff;
  --lucht-onder:#e8f5ff;
  --inkt:#0b2a5b;          /* donkerblauw: tekst */
  --rood:#ff1414;          /* hetzelfde rood als je slides */
  --wolk:#ffffff;
  --wolkschaduw:#bcd8f1;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--inkt);
  background:linear-gradient(var(--lucht-boven),var(--lucht-onder)) fixed;
}

/* ---------- HET HELE SCHERM ----------
   Kop bovenaan, de rest is voor de wolk. Geen scrollen. */
.spel{
  height:100vh; height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:clamp(8px,1.6vw,18px);
  padding:max(14px,env(safe-area-inset-top)) max(clamp(14px,2.4vw,32px),env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(clamp(14px,2.4vw,32px),env(safe-area-inset-left));
}
.kop{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
h1{font:italic 900 clamp(22px,3.4vw,40px)/1.05 var(--font);letter-spacing:-.01em}
.nav{display:flex;gap:18px;align-items:baseline;font-weight:500;font-size:clamp(14px,1.5vw,17px);white-space:nowrap}
.nav a{color:inherit}

/* ---------- ÉÉN WOLK (één "scene") ---------- */
.scene{
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;   /* foto boven, woorden onder */
  gap:clamp(8px,1.6vw,18px);
  min-height:0;
}
.scene[hidden]{display:none}
.scene:not([hidden]){animation:binnen .5s ease-out}
@keyframes binnen{from{opacity:0}}

/* De foto bepaalt de layout: --ar is de verhouding van de foto (breed/hoog).
   .vak meet hoeveel plaats er is, .foto neemt zoveel als past zonder bij te snijden. */
.vak{container-type:size;display:grid;place-items:center;min-height:0;min-width:0}
.foto{
  position:relative;
  aspect-ratio:var(--ar);
  width:min(100cqw, calc(100cqh * var(--ar)));
}
.foto img{display:block;width:100%;height:100%;object-fit:cover}

/* Staande foto op een breed scherm: de woorden komen ernaast, niet eronder. */
@media (min-aspect-ratio:1/1){
  .scene.staand{
    grid-template-rows:minmax(0,1fr);
    grid-template-columns:minmax(0,1fr) minmax(220px,32%);
  }
  .scene.staand .paneel{align-self:center}
  .scene.staand .woorden{flex-direction:column;flex-wrap:nowrap;align-items:center}
  .scene.staand .wolk{--w:clamp(110px,min(18vw,calc((100dvh - 250px)/2.4)),230px)}
}

/* ---------- DE TEKENING OVER DE WOLK ---------- */
.tekening{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 2px rgba(255,255,255,.6));
}
.lijn{stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lijn.rood{fill:#ff1a1a;stroke:#ff1a1a}
.lijn.groen{fill:#27b246;stroke:#27b246}
.lijn.blauw{fill:#0a14ff;stroke:#0a14ff}

/* ---------- WOORDEN ALS WOLKJES ---------- */
.paneel{display:flex;flex-direction:column;align-items:center;gap:6px}
.melding{font-weight:500;font-size:clamp(14px,1.6vw,18px);min-height:1.4em;text-align:center}
.woorden{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 clamp(4px,1.2vw,16px)}

.wolk{
  --w:clamp(100px,min(19vw,26dvh),210px);   /* breedte van een wolkje */
  width:var(--w);
  max-width:var(--w);
  max-height:calc(var(--w) * .6);
  aspect-ratio:200/120;
  position:relative;
  background:none;border:0;padding:0;
  font:inherit;color:inherit;cursor:pointer;
  animation:drijf var(--t,7s) ease-in-out var(--d,0s) infinite;
  transition:opacity .5s, max-width .5s, max-height .5s, margin .5s;
}
@media (max-width:560px){ .wolk{--w:40vw} }

.vorm{position:absolute;inset:0;display:grid;place-items:center;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.vorm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tekst{
  position:relative;z-index:1;
  font:italic 900 calc(var(--w) * .125)/1 var(--font);
  letter-spacing:-.01em;
  translate:0 .12em;
  transition:color .3s;
}
.wolk:hover .vorm{transform:scale(1.07)}
.wolk:focus-visible{outline:3px solid var(--inkt);outline-offset:6px;border-radius:30px}

/* Een wolkje dat langzaam drijft (elk wolkje net anders, ingesteld door de JavaScript) */
@keyframes drijf{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(var(--dx,6px),var(--dy,-6px))}
}

/* Fout woord: het wolkje schudt en vervaagt */
.wolk.fout .vorm{animation:schud .45s}
@keyframes schud{
  20%{transform:translateX(-9px) rotate(-3deg)}
  40%{transform:translateX(9px) rotate(3deg)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.wolk.mis{opacity:.28;pointer-events:none}

/* Juist woord: de andere wolkjes waaien weg, dit wordt groot en rood */
.wolk.weg{opacity:0;max-width:0;max-height:0;pointer-events:none}
.wolk.juist{margin:0 14px}
.wolk.juist .vorm{transform:scale(1.2)}
.wolk.juist .tekst{color:var(--rood)}

.volgende{
  margin-top:8px;
  font:italic 800 clamp(16px,1.9vw,22px) var(--font);
  color:#fff;background:var(--inkt);
  border:0;border-radius:999px;padding:.6em 1.4em;cursor:pointer;
}
.volgende{visibility:hidden;opacity:0;transition:opacity .4s}
.volgende.zichtbaar{visibility:visible;opacity:1}
.volgende:focus-visible,.knop:focus-visible{outline:3px solid var(--rood);outline-offset:3px}

/* ---------- EINDSCHERM ---------- */
.einde{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,28px);min-height:0;overflow:auto}
.einde[hidden]{display:none}
.rij{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:clamp(12px,2vw,28px)}
.mini{display:grid;gap:6px;justify-items:center}
.mini .foto{--h:min(34dvh,42vw);height:var(--h);width:calc(var(--h) * var(--ar))}
.mini figcaption{font:italic 900 clamp(22px,3vw,38px)/1 var(--font);color:var(--rood)}
.score{font-weight:500;font-size:clamp(15px,1.8vw,20px)}
.knoppen{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.knop{
  font:italic 800 clamp(16px,1.9vw,22px) var(--font);
  color:#fff;background:var(--inkt);text-decoration:none;
  border:0;border-radius:999px;padding:.6em 1.4em;cursor:pointer;
}
.knop.licht{background:#fff;color:var(--inkt)}

/* Beweging uit voor wie dat liever heeft (instelling van het besturingssysteem) */
@media (prefers-reduced-motion:reduce){
  .wolk{animation:none}
  .scene:not([hidden]){animation:none}
  .wolk,.vorm{transition:none}
}
</style>

<script>
/* ---------- TEKSTEN ----------
   Alle zichtbare tekst staat hier. Wil je het Nederlands? Pas ze gewoon aan. */
const TEKST = {
  vraag:    'What do you see in this cloud?',
  hint:     'Tap the word you see.',
  fout:     'Not that one. Look again.',
  juist:    w => 'Yes: ' + w + '.',
  volgende: 'Next cloud →',
  laatste:  'See all three →',
  teller:   (i, n) => i + ' of ' + n,
  eindKop:  'Three clouds, three things.',
  eindScore:(goed, n) => goed + ' of ' + n + ' right on the first try.',
  opnieuw:  'Play again',
  terug:    'Back to overview'
};

/* ---------- DE WOORDEN ----------
   woord = het juiste woord (dat jij in de wolk zag), anderen = de foute keuzes.
   Wil je een andere keuze? Pas de lijst aan. */
const WOLKEN = {
  peper:     { woord: 'Peper',     anderen: ['Banaan', 'Maan', 'Vis'] },
  gezichten: { woord: 'Gezichten', anderen: ['Bergen', 'Vogels', 'Golven'] },
  voet:      { woord: 'Voet',      anderen: ['Hand', 'Vleugel', 'Eiland'] }
};

/* ---------- WOLKVORMEN ----------
   Elk wolkje is een paar cirkels (cx, cy, straal) plus een afgeronde balk eronder. */
const VORMEN = [
  { c: [[50,68,30],[90,48,38],[138,56,32],[165,76,24],[100,80,30]], r: [40,70,130,32] },
  { c: [[45,70,26],[80,52,30],[120,40,34],[155,62,30],[178,80,18],[100,78,28]], r: [30,76,160,26] },
  { c: [[55,62,32],[100,44,36],[142,60,30],[70,82,22],[128,84,22]], r: [40,76,120,26] },
  { c: [[38,74,22],[72,56,32],[112,50,30],[148,58,28],[172,78,20]], r: [28,76,160,26] }
];
function wolkSvg(v) {
  const vorm = VORMEN[v % VORMEN.length];
  const delen = vorm.c.map(([x, y, r]) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"/>').join('') +
    '<rect x="' + vorm.r[0] + '" y="' + vorm.r[1] + '" width="' + vorm.r[2] + '" height="' + vorm.r[3] + '" rx="' + vorm.r[3] / 2 + '"/>';
  return '<svg viewBox="0 0 200 120" aria-hidden="true">' +
    '<g fill="#bcd8f1" transform="translate(0,7)">' + delen + '</g>' +
    '<g fill="#fff">' + delen + '</g></svg>';
}

/* ---------- HULPJES ---------- */
const zachtjes = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const scenes   = [...document.querySelectorAll('.scene')];
const einde    = document.querySelector('.einde');
const vraag    = document.getElementById('vraag');
const teller   = document.getElementById('teller');
let nu = 0;            // welke wolk (0, 1, 2)
let fouten = 0;        // fouten in deze wolk
let meteenGoed = 0;    // hoeveel wolken in één keer juist

function husselen(lijst) {
  const a = lijst.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* De tekening "schrijft zich" over de wolk: elk lijnstuk wordt van links naar rechts onthuld. */
function onthul(scene) {
  const rects = [...scene.querySelectorAll('clipPath rect')];
  if (zachtjes) { rects.forEach(r => r.setAttribute('width', r.dataset.w)); return; }
  const duur = 700;
  const stap = Math.min(180, 1200 / rects.length);
  const t0 = performance.now();
  (function beeld(nu) {
    let klaar = true;
    rects.forEach((r, i) => {
      const p = Math.min(1, Math.max(0, (nu - t0 - i * stap) / duur));
      const e = 1 - Math.pow(1 - p, 3);
      r.setAttribute('width', (r.dataset.w * e).toFixed(2));
      if (p < 1) klaar = false;
    });
    if (!klaar) requestAnimationFrame(beeld);
  })(t0);
}

function verberg(scene) {
  scene.querySelectorAll('clipPath rect').forEach(r => r.setAttribute('width', '0'));
}

/* ---------- EEN WOLK TONEN ---------- */
function toon(i) {
  nu = i; fouten = 0;
  einde.hidden = true;
  scenes.forEach((s, k) => { s.hidden = k !== i; });
  const scene = scenes[i];
  const data  = WOLKEN[scene.dataset.id];
  const woorden = scene.querySelector('.woorden');
  const melding = scene.querySelector('.melding');
  const volgende = scene.querySelector('.volgende');

  verberg(scene);
  melding.textContent = TEKST.hint;
  volgende.classList.remove('zichtbaar');
  volgende.textContent = (i === scenes.length - 1) ? TEKST.laatste : TEKST.volgende;
  vraag.textContent = TEKST.vraag;
  teller.textContent = TEKST.teller(i + 1, scenes.length);
  scene.classList.remove('opgelost');

  woorden.innerHTML = '';
  husselen([data.woord, ...data.anderen]).forEach((w, k) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'wolk';
    b.style.setProperty('--t', (6 + Math.random() * 4).toFixed(1) + 's');
    b.style.setProperty('--d', (-Math.random() * 6).toFixed(1) + 's');
    b.style.setProperty('--dx', (Math.random() * 14 - 7).toFixed(0) + 'px');
    b.style.setProperty('--dy', (Math.random() * 10 - 8).toFixed(0) + 'px');
    b.innerHTML = '<span class="vorm">' + wolkSvg(k + i) + '<span class="tekst"></span></span>';
    b.querySelector('.tekst').textContent = w;
    b.addEventListener('click', () => kies(b, w, scene, data));
    woorden.appendChild(b);
  });

  volgende.onclick = () => (i + 1 < scenes.length) ? toon(i + 1) : toonEinde();
}

/* ---------- DE KLIK: dit is de handeling ---------- */
function kies(knop, woord, scene, data) {
  if (scene.classList.contains('opgelost')) return;
  const melding  = scene.querySelector('.melding');
  const volgende = scene.querySelector('.volgende');

  if (woord === data.woord) {
    scene.classList.add('opgelost');
    if (fouten === 0) meteenGoed++;
    knop.classList.add('juist');
    scene.querySelectorAll('.wolk').forEach(w => { if (w !== knop) w.classList.add('weg'); });
    melding.textContent = TEKST.juist(data.woord);
    onthul(scene);                       // de tekening verschijnt pas nu
    setTimeout(() => { volgende.classList.add('zichtbaar'); volgende.focus(); }, zachtjes ? 0 : 900);
  } else {
    fouten++;
    melding.textContent = TEKST.fout;
    knop.classList.add('fout');
    setTimeout(() => {
      knop.classList.remove('fout');
      knop.classList.add('mis');
      knop.disabled = true;
    }, zachtjes ? 0 : 450);
  }
}

/* ---------- EINDSCHERM: de drie wolken met hun tekening ---------- */
function toonEinde() {
  scenes.forEach(s => { s.hidden = true; });
  vraag.textContent = TEKST.eindKop;
  teller.textContent = '';
  const rij = einde.querySelector('.rij');
  rij.innerHTML = '';
  scenes.forEach(scene => {
    const fig = document.createElement('figure');
    fig.className = 'mini';
    fig.style.setProperty('--ar', scene.style.getPropertyValue('--ar'));
    const foto = scene.querySelector('.foto').cloneNode(true);
    foto.querySelectorAll('g[clip-path]').forEach(g => g.removeAttribute('clip-path'));  // tekening meteen helemaal zichtbaar
    const cap = document.createElement('figcaption');
    cap.textContent = WOLKEN[scene.dataset.id].woord;
    fig.append(foto, cap);
    rij.appendChild(fig);
  });
  einde.querySelector('.score').textContent = TEKST.eindScore(meteenGoed, scenes.length);
  einde.hidden = false;
}

document.getElementById('opnieuw').textContent = TEKST.opnieuw;
document.getElementById('terug').textContent = TEKST.terug;
document.getElementById('opnieuw').addEventListener('click', () => { meteenGoed = 0; toon(0); });

toon(0);
</script>
</body>
</html>
