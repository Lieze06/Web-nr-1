<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Spotter</title>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet">
<style>
:root{--sky:#4f83ff;--cloud:#fff;--ink:#1a1adb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--cloud);font-family:"Caprasimo","Cooper Black",Georgia,serif;overflow:hidden;cursor:default;-webkit-tap-highlight-color:transparent}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:1rem;user-select:none}
h1{margin:0;font-weight:400;font-size:clamp(2.4rem,10.5vw,9.5rem);line-height:1;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center}
.gap{width:.3em}
.wind{display:inline-block;transition:transform 3.6s cubic-bezier(.33,0,.2,1),opacity 3.6s ease-in-out}
.wind.blown{transition:transform 1.4s cubic-bezier(.22,.6,.3,1),opacity 1.1s ease-out}
.bob{display:inline-block;animation:bob var(--d,7s) ease-in-out var(--delay,0s) infinite;transform-origin:50% 70%}
@keyframes bob{
0%,100%{transform:translateY(0) scale(1,1) rotate(0)}
30%{transform:translateY(calc(var(--a,8px)*-1)) scale(1.03,.97) rotate(-.6deg)}
65%{transform:translateY(calc(var(--a,8px)*.5)) scale(.97,1.03) rotate(.5deg)}}
#spot{display:inline-block;width:.78em;height:.5em;margin:0 .04em;position:relative;top:.02em}
#spot svg{width:100%;height:100%;overflow:visible;display:block}
#spot .wind,#spot .bob{display:block;width:100%;height:100%}
#spot path{fill:none;stroke:var(--cloud);stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
.puff{position:fixed;pointer-events:none;z-index:5;opacity:0;will-change:transform,opacity}
.puff svg{display:block;width:100%;height:auto}
@keyframes puff{
0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
20%{opacity:var(--o,.4)}
100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 160px)) scale(1.25)}}
@media (prefers-reduced-motion:reduce){.bob,.puff{animation:none}.wind{transition:none}}
</style>
</head>
<body>
<main>
  <h1 aria-label="Cloud Spotter" id="word"></h1>
</main>
<script>
(function(){
  var h=document.getElementById('word');
  var CLOUD='<svg viewBox="0 0 100 62" aria-hidden="true"><g fill="#fff"><circle cx="30" cy="40" r="19"/><circle cx="52" cy="29" r="25"/><circle cx="77" cy="40" r="19"/><rect x="11" y="40" width="85" height="20" rx="10"/></g></svg>';
  var letters=[],i=0;
  function wire(w){
    function blow(e){
      var r=w.getBoundingClientRect();
      var dx=(r.left+r.width/2)-e.clientX,dy=(r.top+r.height/2)-e.clientY;
      var n=Math.hypot(dx,dy)||1;
      var f=22+Math.random()*22;
      w.classList.add('blown');
      w.style.opacity='.35';
      w.style.transform='translate('+(dx/n*f+16).toFixed(1)+'px,'+(dy/n*f-8).toFixed(1)+'px) rotate('+((Math.random()*10-2)).toFixed(1)+'deg)';
      clearTimeout(w._t);
      w._t=setTimeout(function(){w.classList.remove('blown');w.style.transform='';w.style.opacity='';},1300);
    }
    w.addEventListener('pointerenter',blow);
    w.addEventListener('pointerdown',blow);
  }
  function add(ch){
    var w=document.createElement('span');w.className='wind';
    var b=document.createElement('span');b.className='bob';
    b.textContent=ch;
    b.style.setProperty('--d',(6+Math.random()*4).toFixed(2)+'s');
    b.style.setProperty('--delay',(-Math.random()*8).toFixed(2)+'s');
    b.style.setProperty('--a',(5+Math.random()*8).toFixed(1)+'px');
    w.appendChild(b);h.appendChild(w);letters.push(w);
    wire(w);
  }
  function gap(){var g=document.createElement('span');g.className='gap';h.appendChild(g)}
  'Cloud'.split('').forEach(add);gap();
  'Sp'.split('').forEach(add);
  // wolkje op de plek van de o
  var spot=document.createElement('span');spot.id='spot';
  var sw=document.createElement('span');sw.className='wind';
  var sb=document.createElement('span');sb.className='bob';
  sb.style.setProperty('--d','8s');sb.style.setProperty('--delay','-3s');sb.style.setProperty('--a','9px');
  sb.innerHTML='<svg viewBox="0 0 100 62"><path d="M22 56h56a18 18 0 0 0 3-33 16 16 0 0 0-28-8 12 12 0 0 0-14 8 17 17 0 0 0-17 33z"/></svg>';
  sw.appendChild(sb);spot.appendChild(sw);wire(sw);
  h.appendChild(spot);
  'tter'.split('').forEach(add);

  // wolkje drijft rustig en volgt de cursor een beetje
  var tx=0,ty=0,cx=0,cy=0,t0=performance.now();
  addEventListener('pointermove',function(e){
    var r=spot.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2-cx),dy=e.clientY-(r.top+r.height/2-cy);
    var n=Math.min(1,Math.hypot(dx,dy)/600);
    var a=Math.atan2(dy,dx);
    tx=Math.cos(a)*n*38;ty=Math.sin(a)*n*22;
  });
  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function loop(t){
    if(!still){
      var s=(t-t0)/1000;
      cx+=(tx+Math.sin(s*.5)*14-cx)*.04;
      cy+=(ty+Math.sin(s*.8)*7-cy)*.04;
      spot.style.transform='translate('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px)';
    }
    requestAnimationFrame(loop);
  })(t0);

  // klik = grote doorschijnende wolken
  document.addEventListener('pointerdown',function(e){
    var n=2+Math.floor(Math.random()*2);
    for(var k=0;k<n;k++){
      var p=document.createElement('div');p.className='puff';p.innerHTML=CLOUD;
      var size=180+Math.random()*240;
      p.style.width=size+'px';
      p.style.left=(e.clientX+(Math.random()*120-60))+'px';
      p.style.top=(e.clientY+(Math.random()*80-40))+'px';
      p.style.setProperty('--dx',(Math.random()*240-120).toFixed(0)+'px');
      p.style.setProperty('--o',(.28+Math.random()*.2).toFixed(2));
      var dur=5+Math.random()*3;
      p.style.animation='puff '+dur.toFixed(1)+'s ease-out '+(k*.12).toFixed(2)+'s forwards';
      document.body.appendChild(p);
      (function(el,d){setTimeout(function(){el.remove()},(d+1)*1000)})(p,dur);
    }
  });
})();
</script>
</body>
</html>
